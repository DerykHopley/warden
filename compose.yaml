# Local Postgres 17 with pgvector, for `pnpm dev` and the server's tests.
# Bound to 127.0.0.1 only, with trust auth, so no password exists to store.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: warden
      POSTGRES_DB: warden
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warden"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
