name: Fast lane

on:
  pull_request:
    branches: [main, "spec/**"]
  push:
    branches: [main]
  # The full lane runs these checks through it, beside its browser jobs.
  workflow_call:

# A newer push to a PR replaces its older run. On a PR the group names the workflow that runs it (in a call, the
# caller's), so the full lane's call never cancels, or is cancelled by, the PR's own fast lane. Any other run (a push
# to main, or a call from a release's full lane) has a group of its own (its run's id), so it runs to the end beside
# any other: GitHub keeps one waiting run per group, so a shared one would let a third quick merge cancel the second's.
concurrency:
  group: fast-lane-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: warden
          POSTGRES_DB: warden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: warden
      PGDATABASE: warden
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: prettier --check
        run: pnpm format:check
      - name: tsc --noEmit
        run: pnpm typecheck
      - name: vitest (contracts)
        run: pnpm --filter @warden/contracts test
      - name: Turn off fsync on the test Postgres
        # Every create and drop database forces a checkpoint; with fsync on, one took over 4 s and the tests that make
        # databases queued behind it. This Postgres only lives for the job, so durability buys nothing. A service
        # container can't take a command, and fsync reloads without a restart, so ALTER SYSTEM and a reload set it.
        # The reload is asynchronous: the check waits up to 5 s for new sessions to see it, then fails the job.
        run: |
          psql() { docker exec ${{ job.services.postgres.id }} psql -U warden -d warden -v ON_ERROR_STOP=1 "$@"; }
          psql -c "alter system set fsync = off" -c "select pg_reload_conf()"
          for attempt in $(seq 1 10); do
            [ "$(psql -tAc 'show fsync')" = off ] && exit 0
            sleep 0.5
          done
          echo "fsync is still on after the reload" >&2
          exit 1
      - name: vitest (server, against Postgres 17 with pgvector)
        run: pnpm --filter @warden/server test
      - name: vitest (dashboard)
        run: pnpm --filter @warden/dashboard test
      - name: Playwright's Chromium
        run: pnpm --filter @warden/e2e exec playwright install --with-deps chromium
      - name: Browser tests (Playwright, Chromium only)
        # The real server on a throwaway database of the job's Postgres, serving the dashboard built in Vite's e2e mode,
        # where a stand-in replaces Clerk: no Clerk keys or network. The full lane adds the other browsers.
        run: pnpm e2e
      - name: Design lint
        run: pnpm design-lint
      - name: Script tests (scripts/test/*.test.sh)
        # Each stops at its first failed assertion; the step stops at the first test that fails.
        run: for test in scripts/test/*.test.sh; do echo "== $test"; bash "$test"; done
      - name: Image build (not pushed)
        # A stand-in publishable key: the build needs one, and a real key isn't a CI secret worth keeping.
        run: >-
          docker build
          --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          --tag warden:ci .
