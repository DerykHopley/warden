name: Full lane

# Every test in every browser (CLAUDE.md, CI): nightly, by hand, before each deploy (the release workflow calls it), and
# on a PR that changes this file or the browsers it runs. No push trigger: the release calls it on each merge to main,
# and a push trigger too would run it twice.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, "spec/**"]
    paths:
      - .github/workflows/full-lane.yml
      - e2e/playwright.config.ts

# A newer push to a PR replaces its older run; a nightly, a by-hand or a called run goes to the end.
concurrency:
  group: full-lane-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks (lint, types, vitest, design lint, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: warden
          POSTGRES_DB: warden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: warden
      PGDATABASE: warden
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: prettier --check
        run: pnpm format:check
      - name: tsc --noEmit
        run: pnpm typecheck
      - name: vitest (contracts)
        run: pnpm --filter @warden/contracts test
      - name: Turn off fsync on the test Postgres
        # As in the fast lane: this Postgres only lives for the job, and fsync made each create and drop database slow.
        run: |
          psql() { docker exec ${{ job.services.postgres.id }} psql -U warden -d warden -v ON_ERROR_STOP=1 "$@"; }
          psql -c "alter system set fsync = off" -c "select pg_reload_conf()"
          for attempt in $(seq 1 10); do
            [ "$(psql -tAc 'show fsync')" = off ] && exit 0
            sleep 0.5
          done
          echo "fsync is still on after the reload" >&2
          exit 1
      - name: vitest (server, against Postgres 17 with pgvector)
        run: pnpm --filter @warden/server test
      - name: vitest (dashboard)
        run: pnpm --filter @warden/dashboard test
      - name: Design lint
        run: pnpm design-lint
      - name: Script tests (scripts/test/*.test.sh)
        run: for test in scripts/test/*.test.sh; do echo "== $test"; bash "$test"; done

  browsers:
    # One job per browser, in parallel, each with its own Postgres and only its own browser installed.
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: warden
          POSTGRES_DB: warden
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: warden
      PGDATABASE: warden
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright's ${{ matrix.browser }}
        run: pnpm --filter @warden/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests (Playwright, ${{ matrix.browser }})
        # The real server on a throwaway database of the job's Postgres, serving the dashboard built in Vite's e2e mode,
        # where a stand-in replaces Clerk: no Clerk keys or network.
        run: pnpm --filter @warden/e2e exec playwright test --project=${{ matrix.browser }}
