name: Preview

# An owner preview (README.md, "Owner previews"): a push to preview/<name>, from any commit, deploys a revision of
# warden-preview tagged <name> that gets no traffic, on the preview database, as the preview accounts only.
on:
  push:
    branches: ["preview/**"]

permissions:
  contents: read

jobs:
  check:
    name: Check the name and the repository variables
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.check.outputs.name }}
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      # Before anything is built: the name must be a Cloud Run tag, and the six variables the deploy reads set.
      # Without GCP_PROJECT_ID or GCP_PREVIEW_DEPLOY_SA it prints a notice naming what's missing and the run stays
      # green, deploying nothing; with those two but another missing, it fails naming each.
      - name: preview/<name> must be a Cloud Run tag; the deploy's variables must be set
        id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PREVIEW_DEPLOY_SA: ${{ vars.GCP_PREVIEW_DEPLOY_SA }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CLOUD_SQL_CONNECTION: ${{ vars.CLOUD_SQL_CONNECTION }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          WARDEN_GITHUB_APP_CLIENT_ID: ${{ vars.WARDEN_GITHUB_APP_CLIENT_ID }}
        run: scripts/preview-check.sh "$GITHUB_REF_NAME"

  # Outside the preview lock, with no Google credentials: the image goes to the deploy job as an artifact.
  build:
    name: Build the image
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build --build-arg VITE_CLERK_PUBLISHABLE_KEY --tag warden:preview .
          docker save warden:preview | gzip >"$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy the preview
    needs: [check, build]
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Previews share one database, so one migrate-and-deploy at a time, and none is cancelled halfway through a
    # migration. GitHub keeps one waiting job per group: a newer push replaces an older one still waiting, which then
    # shows as cancelled and must be pushed again.
    concurrency:
      group: preview
      cancel-in-progress: false
    # The only job that may ask GitHub for an OIDC token, which Workload Identity Federation trades for
    # warden-preview-deploy's credentials.
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/warden-preview/warden:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      # Loaded before signing in; nothing is built here, so auth's credentials file never reaches a build context.
      - name: Load the image
        run: |
          gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
          docker tag warden:preview "$IMAGE"
      - name: Sign in to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push the image to warden-preview
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$IMAGE"
      - name: Migrate, deploy a tagged revision with no traffic, wait for its health check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_SQL_CONNECTION: ${{ vars.CLOUD_SQL_CONNECTION }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          WARDEN_GITHUB_APP_CLIENT_ID: ${{ vars.WARDEN_GITHUB_APP_CLIENT_ID }}
          # The write app's client id (#334): optional; a preview shares the live write app, and runs with Fix PRs off
          # while it's unset.
          WARDEN_GITHUB_WRITE_APP_CLIENT_ID: ${{ vars.WARDEN_GITHUB_WRITE_APP_CLIENT_ID }}
          # The Judge's keys (#482): optional; a preview's Scan Job shares the live keys once they're switched on.
          WARDEN_JUDGE_KEYS: ${{ vars.WARDEN_JUDGE_KEYS }}
          PREVIEW_NAME: ${{ needs.check.outputs.name }}
        run: scripts/cloud-run-deploy.sh "$IMAGE" preview "$PREVIEW_NAME"
