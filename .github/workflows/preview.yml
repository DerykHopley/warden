name: Preview

# An owner preview (README.md, "Owner previews"): a push to preview/<name>, from any commit, deploys a revision of
# warden-preview tagged <name> that gets no traffic, on the preview database, as the preview accounts only.
on:
  push:
    branches: ["preview/**"]

# Previews share one database, so one deploy at a time, and none is cancelled halfway through a migration.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  name:
    name: Check the preview name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      # Before anything is built: the name becomes a Cloud Run tag, and scripts/cloud-run-deploy.sh holds it to the
      # same rule.
      - name: preview/<name> must be a Cloud Run tag
        id: name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          name=${BRANCH#preview/}
          if [[ ! $name =~ ^[a-z]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::The preview name '$name' must be 1 to 20 lowercase letters, digits and hyphens, starting with a letter and not ending in a hyphen"
            exit 1
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"

  # Without the repository variables (a fork, or before scripts/gcp-setup.sh has run), there's nowhere to deploy: the
  # run says which is missing and stays green.
  not-configured:
    name: Preview not configured
    needs: name
    if: vars.GCP_PROJECT_ID == '' || vars.GCP_PREVIEW_DEPLOY_SA == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say which variable is missing
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PREVIEW_DEPLOY_SA: ${{ vars.GCP_PREVIEW_DEPLOY_SA }}
        run: |
          for var in GCP_PROJECT_ID GCP_PREVIEW_DEPLOY_SA; do
            [[ -n ${!var} ]] || echo "::notice::No preview deployed: the repository variable $var isn't set (scripts/gcp-setup.sh sets it)"
          done

  deploy:
    name: Deploy the preview
    needs: name
    if: vars.GCP_PROJECT_ID != '' && vars.GCP_PREVIEW_DEPLOY_SA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that may ask GitHub for an OIDC token, which Workload Identity Federation trades for
    # warden-preview-deploy's credentials.
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/warden-preview/warden:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # Built before signing in, so the credentials file auth writes into the workspace is never in the build context.
      - name: Build the image
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: docker build --build-arg VITE_CLERK_PUBLISHABLE_KEY --tag "$IMAGE" .
      - name: Sign in to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push the image to warden-preview
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$IMAGE"
      - name: Migrate, deploy a tagged revision with no traffic, wait for its health check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_SQL_CONNECTION: ${{ vars.CLOUD_SQL_CONNECTION }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          PREVIEW_NAME: ${{ needs.name.outputs.name }}
        run: scripts/cloud-run-deploy.sh "$IMAGE" preview "$PREVIEW_NAME"
