source: VDA ISA 2027.1
excel: isa2027.1-de.xlsx
controls:
- id: 1.3.3
  question: Inwieweit wird sichergestellt, dass nur evaluierte und freigegebene organisationsfremde IT-Dienste zum Verarbeiten von Informationswerten der Organisation eingesetzt werden?
  iso_27001: |-
    ISO 27001:2022: A.5.23
    ISO 27017: 14.1.1
    -----
    NIST CSF 2.0: ID.RA-10, ID.AM-02, ID.AM-04, GV.SC-07, GV.SC-09, GV.SC-10, PR.PS-02, PR.PS-05
  requirements:
  - id: M1
    column: must
    text: |-
      Es werden keine organisationsfremden IT-Dienste ohne explizite Bewertung und Umsetzung der Informationssicherheitsanforderungen eingesetzt. 
      Die folgenden Aspekte werden berücksichtigt:
        - Eine Risikobewertung der organisationsfremden IT-Dienste liegt vor,
        - Gesetzliche, regulatorische und vertragliche Anforderungen sind berücksichtigt.
  - id: M2
    column: must
    text: Die organisationsfremden IT-Dienste wurden auf den Schutzbedarf der verarbeiteten Informationswerte abgestimmt.
  - id: S1
    column: should
    text: Anforderungen bezüglich der Beschaffung, Inbetriebnahme und Freigabe im Zusammenhang mit der Nutzung von organisationsfremden IT-Diensten sind ermittelt und erfüllt.
  - id: S2
    column: should
    text: Ein Verfahren zur Freigabe unter Berücksichtigung des Schutzbedarfs ist etabliert.
  - id: S3
    column: should
    text: Organisationsfremde IT-Dienste und deren Freigabe sind dokumentiert.
  - id: S4
    column: should
    text: Es wird regelmäßig überprüft, dass nur freigegebene organisationsfremde IT-Dienste eingesetzt werden.
- id: 1.3.4
  question: Inwieweit wird sichergestellt, dass nur evaluierte und zugelassene Software zum Verarbeiten von Informationswerten der Organisation eingesetzt wird?
  iso_27001: "ISO 27001:2022: A.5.19"
  requirements:
  - id: M1
    column: must
    text: |-
      Vor der Installation oder Nutzung wird die Software freigegeben. Die folgenden Aspekte werden berücksichtigt:
        - Begrenzte Freigabe für bestimmte Anwendungsfälle oder Aufgaben
        - Übereinstimmung mit den Anforderungen an die Informationssicherheit
        - Nutzungsrechte und Lizenzierung der Software
        - Quelle/Reputation der Software
  - id: M2
    column: must
    text: Die Softwarefreigabe gilt auch für Software für einen besonderen Zweck, z. B. Wartungswerkzeuge.
  - id: S1
    column: should
    text: Die zu verwaltenden Software-Typen wie z. B. Firmware, Betriebssysteme, Anwendungen, Bibliotheken, Gerätetreiber sind ermittelt.
  - id: S2
    column: should
    text: Repositorys der verwalteten Software sind vorhanden.
  - id: S3
    column: should
    text: Die Software-Repositorys sind vor unbefugter Manipulation geschützt.
  - id: S4
    column: should
    text: Die Freigabe der Software wird regelmäßig überprüft.
  - id: S5
    column: should
    text: Software-Versionen und Patch-Levels sind bekannt.
  - id: V1
    column: very high
    text: Zusätzliche Anforderungen an die Software-Nutzung (z. B. Notwendigkeit der Steuerung oder Überwachung der Nutzung) sind festgelegt (falls zutreffend). (C, I, A)
