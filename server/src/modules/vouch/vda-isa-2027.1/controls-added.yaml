controls:
- id: 1.3.3
  question: To what extent is it ensured that only evaluated and approved external IT services are used for processing the organization’s information assets?
  iso_27001: |-
    ISO 27001:2022: A.5.23
    ISO 27017: 14.1.1
    -----
    NIST CSF 2.0: ID.RA-10, ID.AM-02, ID.AM-04, GV.SC-07, GV.SC-09, GV.SC-10, PR.PS-02, PR.PS-05
  requirements:
  - id: M1
    column: must
    text: |-
      External IT services are not used without explicit assessment and implementation of the information security requirements. The following aspects are considered:
        - Availability of a risk assessment of the external IT services,
        - Legal, regulatory, and contractual requirements.
  - id: M2
    column: must
    text: The external IT services have been harmonized with the protection need of the processed information assets.
  - id: S1
    column: should
    text: Requirements regarding the procurement, commissioning and release associated with the use of external IT services are determined and fulfilled.
  - id: S2
    column: should
    text: A procedure for release in consideration of the protection need is established.
  - id: S3
    column: should
    text: External IT services and their approval are documented.
  - id: S4
    column: should
    text: It is verified at regular intervals that only approved external IT services are used.
- id: 1.3.4
  question: To what extent is it ensured that only evaluated and approved software is used for processing the organization’s information assets?
  iso_27001: "ISO 27001:2022: A.5.19"
  requirements:
  - id: M1
    column: must
    text: |-
      Software is approved before installation or use. The following aspects are considered: 
         - Limited approval for specific use-cases or roles,
         - Conformance to the information security requirements,
         - Software use rights and licensing,
         - Source/reputation of the software.
  - id: M2
    column: must
    text: Software approval also applies to special purpose software such as maintenance tools.
  - id: S1
    column: should
    text: The types of software such as firmware, operating systems, applications, libraries, device drivers to be managed are determined.
  - id: S2
    column: should
    text: Repositories of managed software exist.
  - id: S3
    column: should
    text: The software repositories are protected against unauthorized manipulation.
  - id: S4
    column: should
    text: Approval of software is regularly reviewed.
  - id: S5
    column: should
    text: Software versions and patch levels are known.
  - id: V1
    column: very high
    text: Additional requirements for software use (e.g., need for control or monitoring of usage) are determined (if any) (C, I, A)
