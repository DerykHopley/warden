<!doctype html>
<!--
  PROTOTYPE, throwaway. Branch prototype/job-board-design, never main.
  Question: does a "board" layout like Vercel Board's acme-db inspector (a rail of places, a dense status list,
  a detail pane with its one decision on top and the conversation under it) suit Warden, with a little more colour,
  on a phone, a laptop and a wide desktop window?
  Five variants on one page, switched with ?variant=A|B|C|D|E (or the bar at the bottom, or ← →):
    A Board  - three panes: rail · list with status tabs · detail + Ask Warden
    B Lanes  - the same rail, the list split into status lanes (columns)
    C Desk   - no rail: a "Waiting on you" strip of every decision across modules, then list + detail
    D Joined - owner's mix: B's lanes with square corners and no gaps between cards, A and B's rail,
               A's Findings filter bar (status tabs filter the lanes). C's "Waiting on you" was tried and dropped
    E Agents - a separate direction: Guard, Patch and Vouch each act as an agent with a feed of its Findings,
               Proposals and decisions (actions inline); Warden on top sums them up. ?variant=E&agent=warden|guard|patch|vouch
  Pages: ?page=findings|overview|setup. Data: the demo seed's Findings and VDA ISA 2027.1 Controls, in memory only.
  Run: pnpm prototype:board  (serves this folder on http://127.0.0.1:5181)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warden board prototype</title>
    <style>
      :root {
        /* Kept from docs/design.md (E) */
        --bg: #f7f5f0;
        --surface: #fffefb;
        --fg: #26241f;
        --muted: #69655c;
        --line: #e6e1d6;
        --chip: #f0ebe1;
        --accent: #36569a;
        --accent-fg: #fff;
        --focus-bg: #eef2f8;
        --focus-line: #cdd8ea;
        --ok: #2f7a4b;
        --font-head: "Iowan Old Style", "Charter", "Georgia", serif;
        --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(60, 50, 30, 0.06), 0 4px 14px rgba(60, 50, 30, 0.05);
        /* Changed: severities carry more colour (Medium is blue, Low is olive, not two greys) */
        --sev-crit: #a3241c;
        --tint-crit: #fbe0dc;
        --sev-high: #9a4a06;
        --tint-high: #fde9d2;
        --sev-med: #24618f;
        --tint-med: #e0ecf7;
        --sev-low: #4f6527;
        --tint-low: #e9f0dc;
        /* New: one hue per module, for its dot, chip and row stripe */
        --mod-guard: #1f7471;
        --tint-guard: #dcefed;
        --mod-patch: #6243a0;
        --tint-patch: #ebe4f6;
        --mod-vouch: #95600b;
        --tint-vouch: #f7ead2;
        /* New: one hue per Status / review state, always with its word and icon */
        --st-open: #36569a;
        --st-wait: #9a5c00;
        --tint-wait: #fcefd6;
        --st-fixed: #2f7a4b;
        --tint-fixed: #def0e3;
        --st-accepted: #5a4f9c;
        --st-fp: #69655c;
        /* New: the rail and the page header band */
        --rail: #efe9dc;
        --rail-hover: #e6dfcf;
        --band: linear-gradient(90deg, #e9eef8 0%, #f3eef8 45%, #f7f1e6 100%);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d1c1a;
          --surface: #262421;
          --fg: #ece7dc;
          --muted: #a6a093;
          --line: #3a3732;
          --chip: #302d29;
          --accent: #a3b9e6;
          --accent-fg: #1d1c1a;
          --focus-bg: #252b36;
          --focus-line: #38465c;
          --ok: #8fc19c;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 14px rgba(0, 0, 0, 0.18);
          --sev-crit: #f0a097;
          --tint-crit: #43231f;
          --sev-high: #f0b878;
          --tint-high: #40301c;
          --sev-med: #9cc6ec;
          --tint-med: #1f3042;
          --sev-low: #b9d38b;
          --tint-low: #2a3420;
          --mod-guard: #7fd0c9;
          --tint-guard: #1c3634;
          --mod-patch: #c4adf0;
          --tint-patch: #2f2642;
          --mod-vouch: #e8bd6f;
          --tint-vouch: #3b2e18;
          --st-open: #a3b9e6;
          --st-wait: #ecbd63;
          --tint-wait: #3d301a;
          --st-fixed: #8fc19c;
          --tint-fixed: #1f3426;
          --st-accepted: #b9b0ef;
          --st-fp: #a6a093;
          --rail: #222120;
          --rail-hover: #2d2b28;
          --band: linear-gradient(90deg, #232a38 0%, #2a2535 45%, #2d2820 100%);
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d1c1a;
        --surface: #262421;
        --fg: #ece7dc;
        --muted: #a6a093;
        --line: #3a3732;
        --chip: #302d29;
        --accent: #a3b9e6;
        --accent-fg: #1d1c1a;
        --focus-bg: #252b36;
        --focus-line: #38465c;
        --ok: #8fc19c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 14px rgba(0, 0, 0, 0.18);
        --sev-crit: #f0a097;
        --tint-crit: #43231f;
        --sev-high: #f0b878;
        --tint-high: #40301c;
        --sev-med: #9cc6ec;
        --tint-med: #1f3042;
        --sev-low: #b9d38b;
        --tint-low: #2a3420;
        --mod-guard: #7fd0c9;
        --tint-guard: #1c3634;
        --mod-patch: #c4adf0;
        --tint-patch: #2f2642;
        --mod-vouch: #e8bd6f;
        --tint-vouch: #3b2e18;
        --st-open: #a3b9e6;
        --st-wait: #ecbd63;
        --tint-wait: #3d301a;
        --st-fixed: #8fc19c;
        --tint-fixed: #1f3426;
        --st-accepted: #b9b0ef;
        --st-fp: #a6a093;
        --rail: #222120;
        --rail-hover: #2d2b28;
        --band: linear-gradient(90deg, #232a38 0%, #2a2535 45%, #2d2820 100%);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--font-body);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12.5px;
      }
      .muted {
        color: var(--muted);
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-head);
        font-weight: 600;
        margin: 0;
      }

      /* ---------- shell ---------- */
      .app {
        display: grid;
        height: 100vh;
        grid-template-columns: 232px minmax(0, 1fr) minmax(380px, 30vw);
      }
      .app.no-rail {
        grid-template-columns: minmax(0, 1fr) minmax(380px, 30vw);
        grid-template-rows: auto minmax(0, 1fr);
      }
      .app.no-detail {
        grid-template-columns: 232px minmax(0, 1fr);
      }
      .app.no-rail.no-detail {
        grid-template-columns: minmax(0, 1fr);
      }
      .rail {
        background: var(--rail);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .brand {
        padding: 16px 16px 10px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .brand b {
        font-family: var(--font-head);
        font-size: 20px;
      }
      .team {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 12px 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .team .who {
        flex: 1;
        min-width: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 9px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pill.role {
        background: var(--chip);
        color: var(--fg);
        font-weight: 500;
      }
      .rail nav {
        overflow: auto;
        padding: 0 8px 12px;
        flex: 1;
      }
      .rail .sect {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        padding: 14px 10px 6px;
      }
      .rail a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--fg);
        text-decoration: none;
      }
      .rail a:hover {
        background: var(--rail-hover);
      }
      .rail a.current {
        background: var(--surface);
        box-shadow: var(--shadow);
        font-weight: 600;
      }
      .rail a .count {
        margin-left: auto;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .rail a .count.wait {
        color: var(--st-wait);
        font-weight: 700;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: none;
      }
      .dot.guard {
        background: var(--mod-guard);
      }
      .dot.patch {
        background: var(--mod-patch);
      }
      .dot.vouch {
        background: var(--mod-vouch);
      }
      .rail .foot {
        border-top: 1px solid var(--line);
        padding: 10px 16px 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .live::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--st-fixed);
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .band {
        background: var(--band);
        border-bottom: 1px solid var(--line);
        padding: 18px 24px 0;
      }
      .band .row1 {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .band h1 {
        font-size: 26px;
      }
      .band .sub {
        color: var(--muted);
        font-size: 14px;
      }
      .band .spacer {
        flex: 1;
      }
      .summary {
        margin: 6px 0 12px;
        font-family: var(--font-head);
        font-size: 17px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab {
        border: 0;
        background: none;
        padding: 10px 12px;
        min-height: 44px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        white-space: nowrap;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab.sel {
        color: var(--fg);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .tab .n {
        font-size: 12px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
      }
      .tab .n.wait {
        background: var(--tint-wait);
        color: var(--st-wait);
        font-weight: 700;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 24px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .chipbtn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 12px;
        min-height: 34px;
        font-size: 13.5px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .chipbtn.sel {
        border-color: var(--accent);
        background: var(--focus-bg);
        font-weight: 600;
      }
      .viewpath {
        margin-left: auto;
        color: var(--muted);
      }
      .scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* list rows (A, C) */
      .row {
        display: grid;
        grid-template-columns: 158px minmax(0, 1fr) auto;
        gap: 4px 14px;
        align-items: start;
        padding: 12px 24px 12px 20px;
        border-bottom: 1px solid var(--line);
        border-left: 4px solid transparent;
        cursor: pointer;
        background: var(--surface);
      }
      .row:hover {
        background: var(--focus-bg);
      }
      .row.sel {
        background: var(--focus-bg);
        border-left-color: var(--accent);
      }
      .row.guard {
        box-shadow: inset 3px 0 0 var(--mod-guard);
      }
      .row.patch {
        box-shadow: inset 3px 0 0 var(--mod-patch);
      }
      .row.vouch {
        box-shadow: inset 3px 0 0 var(--mod-vouch);
      }
      .row .title {
        font-weight: 600;
      }
      .row .meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 4px;
      }
      .row .line {
        color: var(--muted);
        font-size: 13.5px;
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .row .right {
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .age {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 6px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: var(--chip);
        overflow-wrap: anywhere;
      }
      .tag.guard {
        background: var(--tint-guard);
        color: var(--mod-guard);
        border-color: transparent;
        font-weight: 600;
      }
      .tag.patch {
        background: var(--tint-patch);
        color: var(--mod-patch);
        border-color: transparent;
        font-weight: 600;
      }
      .tag.vouch {
        background: var(--tint-vouch);
        color: var(--mod-vouch);
        border-color: transparent;
        font-weight: 600;
      }
      .sev {
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 700;
      }
      .sev.critical {
        color: var(--sev-crit);
        background: var(--tint-crit);
      }
      .sev.high {
        color: var(--sev-high);
        background: var(--tint-high);
      }
      .sev.medium {
        color: var(--sev-med);
        background: var(--tint-med);
      }
      .sev.low {
        color: var(--sev-low);
        background: var(--tint-low);
      }
      .st {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .st svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .st.open {
        color: var(--st-open);
      }
      .st.wait {
        color: var(--st-wait);
      }
      .st.fixed,
      .st.evidenced {
        color: var(--st-fixed);
      }
      .st.accepted {
        color: var(--st-accepted);
      }
      .st.fp,
      .st.na {
        color: var(--st-fp);
      }
      .st.gap {
        color: var(--sev-crit);
      }
      .st.partly {
        color: var(--sev-high);
      }
      .empty {
        padding: 40px 24px;
        color: var(--muted);
      }

      /* lanes (B) */
      .lanes {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(230px, 1fr);
        gap: 14px;
        padding: 16px 20px 24px;
        overflow-x: auto;
        flex: 1;
        min-height: 0;
        align-items: start;
      }
      .lane {
        background: var(--chip);
        border-radius: 14px;
        padding: 10px;
        min-height: 120px;
        max-height: 100%;
        overflow: auto;
      }
      .lane h3 {
        font-family: var(--font-body);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 6px 10px;
      }
      .lane h3 .n {
        margin-left: auto;
        color: var(--muted);
        font-weight: 500;
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 10px 12px;
        margin-bottom: 8px;
        border: 1px solid transparent;
        border-top: 3px solid var(--line);
        cursor: pointer;
      }
      .card.guard {
        border-top-color: var(--mod-guard);
      }
      .card.patch {
        border-top-color: var(--mod-patch);
      }
      .card.vouch {
        border-top-color: var(--mod-vouch);
      }
      .card.sel {
        border-color: var(--accent);
        border-top-width: 3px;
      }
      .card .title {
        font-weight: 600;
        margin: 6px 0 4px;
      }
      .card .meta {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* desk strip (C) */
      .topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 10px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        flex-wrap: wrap;
      }
      .topbar b {
        font-family: var(--font-head);
        font-size: 20px;
      }
      .topbar nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .topbar nav a {
        padding: 8px 12px;
        min-height: 40px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--fg);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .topbar nav a.current {
        background: var(--focus-bg);
        color: var(--accent);
        font-weight: 700;
      }
      .desk {
        padding: 14px 24px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--band);
      }
      .desk h2 {
        font-size: 18px;
        margin-bottom: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .desk .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
      }
      .ask {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 10px 12px;
        border-left: 4px solid var(--st-wait);
        cursor: pointer;
      }
      .ask .k {
        font-size: 12px;
        font-weight: 700;
        color: var(--st-wait);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ask .t {
        font-weight: 600;
        margin: 4px 0 8px;
      }
      .ask .acts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      /* ---------- detail pane ---------- */
      .detail {
        border-left: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .dhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        min-height: 52px;
      }
      .dhead .where {
        color: var(--muted);
        font-size: 13px;
      }
      .iconbtn {
        border: 0;
        background: none;
        min-width: 44px;
        min-height: 44px;
        border-radius: 8px;
        display: inline-grid;
        place-items: center;
        color: var(--muted);
      }
      .iconbtn:hover {
        background: var(--chip);
        color: var(--fg);
      }
      .dscroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .dcard {
        padding: 14px 18px 16px;
        background: var(--focus-bg);
        border-bottom: 1px solid var(--focus-line);
      }
      .dcard .ids {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        color: var(--muted);
      }
      .dcard h2 {
        font-size: 19px;
        margin: 6px 0 8px;
        line-height: 1.3;
      }
      .statehead {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      dl.kv {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 6px 12px;
        margin: 0 0 6px;
        font-size: 14px;
      }
      dl.kv dt {
        color: var(--muted);
      }
      dl.kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .decision {
        margin: 12px 0 0;
        border-radius: var(--radius);
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .decision.wait {
        border-color: var(--st-wait);
        background: var(--tint-wait);
      }
      .decision.done {
        border-color: var(--st-fixed);
        background: var(--tint-fixed);
      }
      .decision h4 {
        margin: 0 0 6px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .decision p {
        margin: 0 0 10px;
      }
      .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 600;
      }
      .btn:hover {
        background: var(--chip);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.small {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13.5px;
      }
      .btn[aria-busy="true"] {
        opacity: 0.7;
        cursor: progress;
      }
      .form {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .form textarea,
      .form select,
      .form input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: var(--surface);
      }
      .sectionh {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      .thread {
        padding: 10px 18px 16px;
        display: grid;
        gap: 12px;
      }
      .msg {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
      }
      .av {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        background: var(--chip);
      }
      .av.w {
        background: var(--accent);
        color: var(--accent-fg);
        font-family: var(--font-head);
      }
      .msg .who {
        font-weight: 700;
        font-size: 13.5px;
      }
      .msg .who span {
        font-weight: 400;
        color: var(--muted);
        margin-left: 6px;
      }
      .kind {
        font-size: 11.5px;
        font-weight: 700;
        padding: 0 6px;
        border-radius: 5px;
        margin-right: 4px;
        text-transform: lowercase;
      }
      .kind.proposal {
        background: var(--tint-wait);
        color: var(--st-wait);
      }
      .kind.decision {
        background: var(--tint-fixed);
        color: var(--st-fixed);
      }
      .kind.risk {
        background: var(--tint-crit);
        color: var(--sev-crit);
      }
      .kind.fix {
        background: var(--tint-guard);
        color: var(--mod-guard);
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 10px 14px 14px;
      }
      .ctx {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .composer .box {
        display: flex;
        gap: 8px;
      }
      .composer input {
        flex: 1;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 0 12px;
        background: var(--bg);
      }

      /* setup steps */
      .steps {
        list-style: none;
        margin: 0;
        padding: 16px 24px;
        display: grid;
        gap: 10px;
        max-width: 980px;
      }
      .step {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        cursor: pointer;
        box-shadow: var(--shadow);
      }
      .step.sel {
        border-color: var(--accent);
      }
      .step .num {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: var(--chip);
      }
      .step.done .num {
        background: var(--tint-fixed);
        color: var(--st-fixed);
      }
      .step.wait .num {
        background: var(--tint-wait);
        color: var(--st-wait);
      }
      .step h3 {
        font-family: var(--font-body);
        font-size: 15.5px;
      }

      /* prototype switcher: obviously not part of the design */
      .switcher {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 4px;
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 4px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        font:
          13px/1 system-ui,
          sans-serif;
      }
      .switcher button {
        background: none;
        border: 0;
        color: #fff;
        min-width: 36px;
        min-height: 36px;
        border-radius: 999px;
      }
      .switcher button:hover {
        background: #333;
      }
      .switcher .lbl {
        padding: 0 8px;
        white-space: nowrap;
      }
      .switcher .theme {
        font-size: 12px;
        padding: 0 10px;
      }
      .mob-only {
        display: none;
      }

      /* ---------- widths ---------- */
      /* 900-1279: the detail pane floats over the list, as the current panel does at 640-1100 */

      /* ---------- variant D: square, joined lanes ---------- */
      .v-D {
        --radius: 0;
      }
      .v-D .main {
        overflow: auto;
      }
      .v-D .main > .scroll {
        overflow: visible;
        flex: none;
      }
      .v-D .lanes {
        flex: none;
        overflow-x: auto;
        align-items: stretch;
        gap: 0;
        padding: 0;
        border-top: 1px solid var(--line);
        grid-auto-columns: minmax(200px, 1fr);
      }
      .v-D .lane {
        border-radius: 0;
        padding: 0;
        max-height: none;
        background: var(--surface);
        border-right: 1px solid var(--line);
      }
      .v-D .lane h3 {
        padding: 12px 14px;
        margin: 0;
        background: var(--chip);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .v-D .lane > .muted {
        padding: 12px 14px !important;
      }
      .v-D .card {
        border-radius: 0;
        margin: 0;
        box-shadow: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-left: 4px solid var(--line);
        border-top: 0;
        padding: 12px 14px;
      }
      .v-D .card.guard {
        border-left-color: var(--mod-guard);
      }
      .v-D .card.patch {
        border-left-color: var(--mod-patch);
      }
      .v-D .card.vouch {
        border-left-color: var(--mod-vouch);
      }
      .v-D .card:hover {
        background: var(--focus-bg);
      }
      .v-D .card.sel {
        background: var(--focus-bg);
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .v-D .desk .cards {
        gap: 0;
        border: 1px solid var(--line);
      }
      .v-D .ask {
        border-radius: 0;
        box-shadow: none;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .v-D .pill,
      .v-D .sev,
      .v-D .tag,
      .v-D .chipbtn,
      .v-D .tab .n,
      .v-D .kind,
      .v-D .av,
      .v-D .iconbtn,
      .v-D .rail a,
      .v-D .team,
      .v-D .mobbar nav a,
      .v-D .composer input,
      .v-D .form textarea,
      .v-D .form select,
      .v-D .step .num,
      .v-D .dot {
        border-radius: 0;
      }
      .v-D .steps {
        gap: 0;
        padding: 0;
        max-width: none;
        border-top: 1px solid var(--line);
      }
      .v-D .step {
        box-shadow: none;
        border-width: 0 0 1px 0;
      }
      .v-D .step.sel {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .v-D .decision {
        border-radius: 0;
      }
      @media (max-width: 899px) {
        .v-D .lanes {
          padding: 0 0 80px;
        }
        .v-D .lane {
          border-right: 0;
        }
        .v-D .desk .cards {
          border: 0;
        }
      }
      @media (max-width: 1279px) {
        .app,
        .app.no-detail {
          grid-template-columns: 200px minmax(0, 1fr);
        }
        .app.no-rail,
        .app.no-rail.no-detail {
          grid-template-columns: minmax(0, 1fr);
        }
        .detail {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          width: min(440px, 92vw);
          z-index: 20;
          box-shadow: -8px 0 30px rgba(0, 0, 0, 0.18);
        }
        .row {
          grid-template-columns: 150px minmax(0, 1fr) auto;
        }
      }
      /* under 900: no rail; a top bar with the pages; the list is the page; detail is full screen */
      @media (max-width: 899px) {
        .app,
        .app.no-detail {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
        }
        .rail {
          display: none;
        }
        .mob-only {
          display: flex;
        }
        .mobbar {
          grid-column: 1 / -1;
          display: flex;
          flex-direction: column;
          background: var(--rail);
          border-bottom: 1px solid var(--line);
        }
        .mobbar .top {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 8px 16px;
        }
        .mobbar .top b {
          font-family: var(--font-head);
          font-size: 19px;
        }
        .mobbar nav {
          display: flex;
          gap: 2px;
          padding: 0 10px 6px;
          overflow-x: auto;
          scrollbar-width: none;
        }
        .mobbar nav a {
          flex: none;
          padding: 0 12px;
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          text-decoration: none;
          color: var(--fg);
          border-radius: 8px;
        }
        .mobbar nav a.current {
          background: var(--surface);
          font-weight: 700;
        }
        .band {
          padding: 14px 16px 0;
        }
        .band h1 {
          font-size: 22px;
        }
        .filters {
          padding: 8px 16px;
        }
        .viewpath {
          display: none;
        }
        .row {
          grid-template-columns: minmax(0, 1fr) auto;
          padding: 12px 16px 12px 14px;
        }
        .row .stcol {
          grid-column: 1 / -1;
        }
        .row .line,
        .row .meta .rule {
          display: none;
        }
        .detail {
          width: 100vw;
        }
        .lanes {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          padding: 12px 16px 80px;
        }
        .desk {
          padding: 12px 16px;
        }
        .desk .cards {
          grid-auto-flow: column;
          grid-auto-columns: 82%;
          grid-template-columns: none;
          overflow-x: auto;
        }
        .topbar {
          padding: 8px 16px;
          gap: 8px;
        }
        .steps {
          padding: 12px 16px 80px;
        }
        .step {
          grid-template-columns: 30px minmax(0, 1fr);
        }
        .step .right {
          grid-column: 2;
        }
        .switcher .theme {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .detail.enter {
          animation: slide 0.15s ease-out;
        }
        @keyframes slide {
          from {
            transform: translateX(24px);
            opacity: 0.4;
          }
          to {
            transform: none;
            opacity: 1;
          }
        }
      }

      /* ---------- variant E: each module is an agent (owner's direction, 2026-11-27) ---------- */
      :root {
        --agent-warden: #c2560c;
        --tint-warden: #fde6d3;
        --agent-vouch: #2f55b8;
        --tint-vouch-agent: #e1e8fa;
        --agent-patch: #7440c4;
        --tint-patch-agent: #ede3fb;
        --agent-guard: #2c7a2f;
        --tint-guard-agent: #e0f1dc;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --agent-warden: #f29a5a;
          --tint-warden: #3d2717;
          --agent-vouch: #8fa9f0;
          --tint-vouch-agent: #1f2840;
          --agent-patch: #c3a0f5;
          --tint-patch-agent: #2e2340;
          --agent-guard: #8fd28c;
          --tint-guard-agent: #1f3320;
        }
      }
      :root[data-theme="dark"] {
        --agent-warden: #f29a5a;
        --tint-warden: #3d2717;
        --agent-vouch: #8fa9f0;
        --tint-vouch-agent: #1f2840;
        --agent-patch: #c3a0f5;
        --tint-patch-agent: #2e2340;
        --agent-guard: #8fd28c;
        --tint-guard-agent: #1f3320;
      }
      .e-app {
        --radius: 0;
        display: grid;
        height: 100vh;
        grid-template-columns: 280px minmax(0, 1fr) 250px 60px;
      }
      .e-app * {
        border-radius: 0 !important;
      }
      .e-agents {
        background: var(--rail);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .e-agents .brand {
        padding: 14px 16px 6px;
      }
      .e-agents .team {
        margin: 0 12px 12px;
      }
      .e-list {
        overflow: auto;
        flex: 1;
      }
      .e-ag {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 2px 12px;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0;
        border-left: 4px solid transparent;
        background: none;
        padding: 12px 14px 12px 12px;
        min-height: 64px;
        border-bottom: 1px solid var(--line);
      }
      .e-ag:hover {
        background: var(--rail-hover);
      }
      .e-ag.sel {
        background: var(--surface);
        border-left-color: var(--ag);
      }
      .e-ag .nm {
        font-weight: 700;
      }
      .e-ag .last {
        grid-column: 2 / 4;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .e-ag .tm {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .e-ag .av2 {
        grid-row: 1 / 3;
      }
      .e-ag.top {
        grid-template-columns: 56px minmax(0, 1fr) auto;
        background: var(--tint-warden);
        min-height: 84px;
      }
      .e-ag.top.sel {
        background: var(--surface);
      }
      .av2 {
        width: 44px;
        height: 44px;
        background: var(--ag);
        display: grid;
        place-items: center;
        position: relative;
        flex: none;
      }
      .av2::before,
      .av2::after {
        content: "";
        position: absolute;
        top: 36%;
        width: 7px;
        height: 7px;
        background: var(--surface);
      }
      .av2::before {
        left: 26%;
      }
      .av2::after {
        right: 26%;
      }
      .av2.big {
        width: 56px;
        height: 56px;
      }
      .av2.sm {
        width: 32px;
        height: 32px;
      }
      .av2.sm::before,
      .av2.sm::after {
        width: 5px;
        height: 5px;
      }
      .ag-warden {
        --ag: var(--agent-warden);
        --agt: var(--tint-warden);
      }
      .ag-vouch {
        --ag: var(--agent-vouch);
        --agt: var(--tint-vouch-agent);
      }
      .ag-patch {
        --ag: var(--agent-patch);
        --agt: var(--tint-patch-agent);
      }
      .ag-guard {
        --ag: var(--agent-guard);
        --agt: var(--tint-guard-agent);
      }
      .wbadge {
        background: var(--tint-wait);
        color: var(--st-wait);
        font-size: 12px;
        font-weight: 700;
        padding: 1px 7px;
        white-space: nowrap;
      }
      .e-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }
      .e-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        border-top: 4px solid var(--ag);
      }
      .e-head h1 {
        font-size: 22px;
      }
      .e-head .sub {
        color: var(--muted);
        font-size: 13.5px;
      }
      .e-feed {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 18px 22px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .e-day {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .e-day::before,
      .e-day::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .e-msg {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 10px;
        max-width: 860px;
      }
      .e-msg .bub {
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid var(--ag);
        padding: 10px 14px;
      }
      .e-msg .who {
        font-weight: 700;
        font-size: 13.5px;
        margin-bottom: 4px;
      }
      .e-msg .who span {
        color: var(--muted);
        font-weight: 400;
        margin-left: 6px;
      }
      .e-msg.person {
        grid-template-columns: minmax(0, 1fr) 32px;
        margin-left: auto;
      }
      .e-msg.person .bub {
        background: var(--chip);
        border-left: 1px solid var(--line);
        border-right: 3px solid var(--accent);
      }
      .e-msg.person .av {
        grid-column: 2;
        grid-row: 1;
      }
      .e-msg.wait .bub {
        background: var(--tint-wait);
        border-color: var(--st-wait);
        border-left-width: 3px;
      }
      .e-item {
        margin-top: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        padding: 10px 12px;
        cursor: pointer;
      }
      .e-item:hover {
        background: var(--focus-bg);
      }
      .e-item .t {
        font-weight: 600;
        margin: 4px 0 2px;
      }
      .e-item .meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .e-item .more {
        margin-top: 8px;
        font-size: 14px;
      }
      .e-msg .acts {
        margin-top: 10px;
      }
      .e-sum {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 10px;
        border: 1px solid var(--line);
      }
      .e-sum button {
        text-align: left;
        border: 0;
        border-right: 1px solid var(--line);
        background: var(--bg);
        padding: 10px 12px;
        border-top: 4px solid var(--ag);
      }
      .e-sum button:last-child {
        border-right: 0;
      }
      .e-sum button:hover {
        background: var(--focus-bg);
      }
      .e-sum b {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .e-composer {
        border-top: 1px solid var(--line);
        padding: 10px 22px 14px;
        background: var(--surface);
      }
      .e-composer .mock {
        font-size: 12px;
        font-weight: 700;
        color: var(--st-wait);
        background: var(--tint-wait);
        padding: 1px 6px;
        margin-right: 6px;
      }
      .e-composer .box {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .e-composer input {
        flex: 1;
        min-height: 44px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: var(--bg);
      }
      .e-quick {
        border-left: 1px solid var(--line);
        background: var(--surface);
        padding: 16px 14px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .e-quick h2 {
        font-family: var(--font-body);
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 6px 0 2px;
      }
      .e-quick .qa {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        text-align: left;
        font-weight: 600;
      }
      .e-quick .qa:hover {
        background: var(--focus-bg);
      }
      .e-quick .qa .ic {
        width: 10px;
        height: 10px;
        background: var(--ag);
        flex: none;
      }
      .e-quick .facts {
        font-size: 13.5px;
        display: grid;
        gap: 4px;
      }
      .e-strip {
        border-left: 1px solid var(--line);
        background: var(--rail);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 0;
      }
      .e-strip button {
        border: 0;
        background: none;
        padding: 4px;
        position: relative;
        min-width: 44px;
        min-height: 44px;
        display: grid;
        place-items: center;
      }
      .e-strip button.sel {
        outline: 2px solid var(--ag);
        outline-offset: -2px;

      .e-strip .dotw {
        position: absolute;
        right: 0;

          fp: { k: "fp", w: "False positive", i: ICON.fp },
        }[f.status];
      }
      function cstate(c) {
        if (c.review !== "Reviewed") return { k: "wait", w: c.review, i: ICON.wait };
        if (c.gap) return { k: "gap", w: "Gap", i: ICON.open };
        return { k: "evidenced", w: "Reviewed", i: ICON.fixed };
      }
      const vclass = (v) =>
        ({
          Evidenced: "evidenced",
          "Partly evidenced": "partly",
          "Not evidenced": "gap",
          "Not applicable": "na",
        })[v];
      const st = (s) => `<span class="st ${s.k}">${s.i}${esc(s.w)}</span>`;
      const sevp = (s) => `<span class="sev ${s}">${SEVW[s]}</span>`;
      const modt = (m) => `<span class="tag ${m}">${MODW[m]}</span>`;
      const waitingF = () => F.filter((f) => f.proposal || f.unconfirmed);
      const waitingC = () => C.filter((c) => c.review !== "Reviewed");
      const TABS = [
        ["open", "Open", (f) => f.status === "open"],
        ["waiting", "Waiting on a Lead", (f) => f.proposal || f.unconfirmed],
        ["accepted", "Accepted", (f) => f.status === "accepted"],
        ["fixed", "Fixed", (f) => f.status === "fixed"],
        ["fp", "False positive", (f) => f.status === "fp"],
        ["all", "Every status", () => true],
      ];
      function visibleF() {
        const t = TABS.find((t) => t[0] === S.tab) || TABS[0];
        return F.filter(t[2]).filter((f) => S.mod === "all" || f.mod === S.mod);
      }

      // ---------------- pieces ----------------
      function pageLinks(cls) {
        const openN = F.filter((f) => f.status === "open").length;
        const items = [
          ["findings", "Findings", openN, waitingF().length],
          ["overview", "Overview", null, waitingC().length],
          ["products", "Products", 2, 0],
          ["people", "People", 2, 0],
          ["setup", "Setup", null, STEPS.filter((s) => s.state === "wait").length],
        ];
        return items
          .map(
            ([id, w, n, wait]) =>
              `<a href="#" data-page="${id}" class="${S.page === id ? "current" : ""}" ${S.page === id ? 'aria-current="page"' : ""}>${w}${wait ? `<span class="count wait" title="${wait} waiting on a person">${wait} waiting</span>` : n != null ? `<span class="count">${n}</span>` : ""}</a>`,
          )
          .join("");
      }
      function rail() {
        const by = (m) => F.filter((f) => f.mod === m && f.status === "open").length;
        return `<aside class="rail">
    <div class="brand"><b>Warden</b></div>
    <div class="team"><div class="who"><b>Elm</b><div class="muted" style="font-size:12.5px">Level: Quick</div></div><span class="pill role">Admin</span></div>
    <nav aria-label="Pages">${pageLinks()}
      <div class="sect">Modules</div>
      <a href="#" data-mod="guard"><span class="dot guard"></span>Guard<span class="count">${by("guard")}</span></a>
      <a href="#" data-mod="patch"><span class="dot patch"></span>Patch<span class="count">${by("patch")}</span></a>
      <a href="#" data-page="overview"><span class="dot vouch"></span>Vouch<span class="count">${C.filter((c) => c.gap).length} Gaps</span></a>
    </nav>
    <div class="foot"><span class="live">Last Scan Nov 27, 9:14 AM</span><div style="margin-top:6px">Signed in as Elm's Admin · <a href="#" style="color:var(--accent)">Sign out</a></div></div>
  </aside>`;
      }
      function mobbar() {
        return `<header class="mobbar mob-only"><div class="top"><b>Warden</b><span>Elm</span><span class="pill role">Admin</span><span style="flex:1"></span><span class="live">Nov 27</span></div><nav aria-label="Pages">${pageLinks()}</nav></header>`;
      }
      function topbar() {
        return `<header class="topbar"><b>Warden</b><span>Elm <span class="pill role">Admin</span></span><nav aria-label="Pages">${pageLinks()}</nav><span style="flex:1"></span><span class="live">Last Scan Nov 27, 9:14 AM</span></header>`;
      }
      function findingsBand() {
        const open = F.filter((f) => f.status === "open");
        const crit = open.filter((f) => f.sev === "critical").length;
        const tabs = TABS.map(([id, w, fn]) => {
          const n = F.filter(fn).length;
          return `<button class="tab ${S.tab === id ? "sel" : ""}" data-tab="${id}" aria-pressed="${S.tab === id}">${w}<span class="n ${id === "waiting" && n ? "wait" : ""}">${n}</span></button>`;
        }).join("");
        return `<div class="band"><div class="row1"><h1>Findings</h1><span class="sub">Level: Quick · <a href="#" data-page="overview" style="color:var(--accent)">see the journey</a></span><span class="spacer"></span></div>
    <div class="summary">${open.length} open Findings, ${crit} Critical${waitingF().length ? ` · <span style="color:var(--st-wait)">${waitingF().length} waiting on a Lead</span>` : ""}</div>
    ${S.variant === "B" ? "" : `<div class="tabs" role="group" aria-label="Status">${tabs}</div>`}</div>
    <div class="filters">${["all", "guard", "patch"].map((m) => `<button class="chipbtn ${S.mod === m ? "sel" : ""}" data-modf="${m}">${m === "all" ? "Any module" : `<span class="dot ${m}"></span>${MODW[m]}`}</button>`).join("")}
    <span class="viewpath mono">/findings?status=${S.tab}${S.mod !== "all" ? "&module=" + S.mod : ""}</span></div>`;
      }
      function frow(f) {
        return `<li class="row ${f.mod} ${S.sel === f.id ? "sel" : ""}" data-sel="${f.id}" tabindex="0">
    <div class="stcol">${st(fstate(f))}</div>
    <div><div class="title">${esc(f.title)}</div>
      <div class="meta">${modt(f.mod)}<span class="tag mono rule">${f.rule}</span><span class="tag">${f.asset}: ${esc(f.ref)}</span></div>
      <div class="line">${esc(f.ev)}</div></div>
    <div class="right">${sevp(f.sev)}<span class="age"><span class="mono">${f.id}</span> · ${f.age}</span></div></li>`;
      }
      function fcard(f) {
        return `<div class="card ${f.mod} ${S.sel === f.id ? "sel" : ""}" data-sel="${f.id}" tabindex="0">
    <div class="meta">${sevp(f.sev)}${modt(f.mod)}<span class="age" style="margin-left:auto">${f.age}</span></div>
    <div class="title">${esc(f.title)}</div>
    <div class="meta">${st(fstate(f))}<span class="muted" style="font-size:12.5px">${f.asset}: ${esc(f.ref)}</span></div></div>`;
      }
      function lanes(groups) {
        return `<div class="lanes">${groups.map(([title, cls, items, render]) => `<section class="lane"><h3><span class="st ${cls}">${title}</span><span class="n">${items.length}</span></h3>${items.map(render).join("") || '<div class="muted" style="padding:6px">Nothing here.</div>'}</section>`).join("")}</div>`;
      }
      function deskStrip() {
        const asks = [
          ...F.filter((f) => f.proposal).map((f) => ({
            sel: f.id,
            page: "findings",
            k: `Proposal · ${f.proposal.kind}`,
            t: f.title,
            by: f.proposal.by,
            acts: `<button class="btn small primary" data-act="approve" data-id="${f.id}">Approve</button><button class="btn small" data-act="reject" data-id="${f.id}">Reject</button>`,
          })),
          ...F.filter((f) => f.unconfirmed).map((f) => ({
            sel: f.id,
            page: "findings",
            k: "Unconfirmed fix",
            t: f.title,
            by: "the last Scan",
            acts: `<button class="btn small primary" data-act="confirmfix" data-id="${f.id}">Confirm fix</button><button class="btn small" data-act="moved" data-id="${f.id}">Mark moved</button>`,
          })),
          ...C.filter((c) => c.review !== "Reviewed").map((c) => ({
            sel: c.ref,
            page: "overview",
            k: `Control · ${c.review}`,
            t: `${c.ref}: ${c.verdict}`,
            by: "Vouch",
            acts: `<button class="btn small primary" data-act="confirm" data-id="${c.ref}">Confirm</button><button class="btn small" data-act="override" data-id="${c.ref}">Override…</button>`,
          })),
          ...STEPS.filter((s) => s.state === "wait").map((s) => ({
            sel: s.id,
            page: "setup",
            k: "Setup",
            t: s.title,
            line: s.line,
            acts: `<button class="btn small" data-page="setup" data-sel2="${s.id}">Open Setup</button>`,
          })),
        ];
        return `<section class="desk"><h2>Waiting on you <span class="pill" style="background:var(--tint-wait);color:var(--st-wait)">${asks.length}</span></h2>
    ${asks.length ? `<div class="cards">${asks.map((a) => `<div class="ask" data-sel="${a.sel}" data-page2="${a.page}" tabindex="0"><div class="k">${esc(a.k)}</div><div class="t">${esc(a.t)}</div><div class="muted" style="font-size:12.5px;margin-bottom:8px">${a.line ? esc(a.line) : "from " + esc(a.by)}</div><div class="acts">${a.acts}</div></div>`).join("")}</div>` : '<div class="muted">Nothing waiting. Every decision is made.</div>'}</section>`;
      }

      // ---------------- pages (the middle) ----------------
      function findingsMain() {
        const list = visibleF();
        if (S.variant === "B" || S.variant === "D") {
          const tabFn =
            S.variant === "D" ? (TABS.find((t) => t[0] === S.tab) || TABS[0])[2] : () => true;
          const pool = F.filter((f) => S.mod === "all" || f.mod === S.mod).filter(tabFn);
          return (
            findingsBand() +
            lanes([
              ["Waiting on a Lead", "wait", pool.filter((f) => f.proposal || f.unconfirmed), fcard],
              [
                "Open",
                "open",
                pool.filter((f) => f.status === "open" && !f.proposal && f.fix !== "open"),
                fcard,
              ],
              ["Fix PR open", "open", pool.filter((f) => f.fix === "open"), fcard],
              ["Done", "fixed", pool.filter((f) => f.status !== "open" && !f.unconfirmed), fcard],
            ])
          );
        }
        return (
          (S.variant === "C" ? deskStrip() : "") +
          findingsBand() +
          `<div class="scroll"><ul class="list">${list.map(frow).join("") || '<li class="empty">Nothing matches this view.</li>'}</ul></div>`
        );
      }
      function overviewMain() {
        const gaps = C.filter((c) => c.gap).length,
          wait = waitingC().length;
        const band = `<div class="band" style="padding-bottom:14px"><div class="row1"><h1>Overview</h1><span class="sub">VDA ISA 2027.1</span></div>
    <div class="summary">Are we ready for the audit? ${gaps || wait ? `Not yet: ${[gaps && `${gaps} Gaps`, wait && `${wait} Control${wait > 1 ? "s" : ""} waiting for review`].filter(Boolean).join(", ")}.` : `Yes: all ${C.length} Controls are reviewed, with no Gaps.`}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${[
      ["Quick", "Current", "open"],
      ["Standard", "Not started", "fp"],
      ["Audit-ready", `${C.length - wait} of ${C.length} Controls reviewed`, "wait"],
    ]
      .map(
        ([l, s, k]) =>
          `<span class="chipbtn" style="cursor:default"><b>${l}</b><span class="st ${k}" style="font-weight:500">${s}</span></span>`,
      )
      .join("")}</div></div>`;
        const ccard = (c) =>
          `<div class="card vouch ${S.sel === c.ref ? "sel" : ""}" data-sel="${c.ref}" tabindex="0"><div class="meta"><span class="mono">${c.ref}</span><span class="st ${vclass(c.verdict)}" style="margin-left:auto">${c.verdict}</span></div><div class="title" style="font-weight:500">${esc(c.q)}</div><div class="meta">${st(cstate(c))}</div></div>`;
        if (S.variant === "B" || S.variant === "D")
          return (
            band +
            lanes([
              ["Waiting for review", "wait", C.filter((c) => c.review !== "Reviewed"), ccard],
              ["Gap", "gap", C.filter((c) => c.review === "Reviewed" && c.gap), ccard],
              ["Evidenced", "fixed", C.filter((c) => c.review === "Reviewed" && !c.gap), ccard],
            ])
          );
        const row = (
          c,
        ) => `<li class="row vouch ${S.sel === c.ref ? "sel" : ""}" data-sel="${c.ref}" tabindex="0"><div class="stcol">${st(cstate(c))}</div>
    <div><div class="title" style="font-weight:500"><span class="mono" style="margin-right:8px">${c.ref}</span>${esc(c.q)}</div><div class="meta"><span class="tag vouch">Vouch</span><span class="tag">${c.open} Open Finding${c.open === 1 ? "" : "s"}</span></div></div>
    <div class="right"><span class="st ${vclass(c.verdict)}">${c.verdict}</span><span class="age">${c.review === "Reviewed" ? "Reviewed" : c.review}</span></div></li>`;
        return (
          (S.variant === "C" ? deskStrip() : "") +
          band +
          `<div class="scroll"><ul class="list">${C.map(row).join("")}</ul>
    <p class="muted" style="padding:12px 24px;font-size:13px">© 2026 ENX Association. Licence: CC BY-ND 4.0</p></div>`
        );
      }
      function setupMain() {
        const band = `<div class="band" style="padding-bottom:14px"><div class="row1"><h1>Setup</h1><span class="sub">What Warden may read and change for Elm</span></div><div class="summary">${STEPS.filter((s) => s.state === "done").length} of ${STEPS.length} set up · Level: Quick</div></div>`;
        const icon = { done: "✓", wait: "!", todo: "" };
        return (
          (S.variant === "C" ? deskStrip() : "") +
          band +
          `<div class="scroll"><ol class="steps">${STEPS.map((s, i) => `<li class="step ${s.state} ${S.sel === s.id ? "sel" : ""}" data-sel="${s.id}" tabindex="0"><span class="num">${icon[s.state] || i + 1}</span><div><h3>${s.title}</h3><div class="muted" style="font-size:14px;overflow-wrap:anywhere">${esc(s.line)}</div></div><div class="right">${s.action ? `<button class="btn small ${s.state === "wait" ? "primary" : ""}" data-act="step" data-id="${s.id}">${s.action}</button>` : st(s.state === "done" ? { k: "fixed", w: "Done", i: ICON.fixed } : { k: "fp", w: "Later", i: ICON.open })}</div></li>`).join("")}</ol></div>`
        );
      }
      function stubMain(w) {
        return `<div class="band" style="padding-bottom:14px"><h1>${w}</h1></div><div class="empty">Not in this prototype: it would follow the same rail, list and detail pattern.</div>`;
      }

      // ---------------- detail pane ----------------
      function chatFor(id, seed) {
        if (!S.chat[id]) S.chat[id] = seed;
        return S.chat[id];
      }
      function msgs(list) {
        return list
          .map(
            (m) =>
              `<div class="msg"><span class="av ${m.w ? "w" : ""}">${m.w ? "W" : esc(m.who[0])}</span><div><div class="who">${esc(m.who)}<span>${m.at}</span></div><div>${m.kind ? `<span class="kind ${m.kind}">${m.kind}</span>` : ""}${esc(m.text)}</div></div></div>`,
          )
          .join("");
      }
      function findingDetail(f) {
        const s = fstate(f);
        let decide = "";
        if (f.proposal)
          decide = `<div class="decision wait"><h4 style="color:var(--st-wait)">${ICON.wait.replace("<svg", '<svg width="15" height="15"')} Held for a Lead</h4>
      <p><b>${f.proposal.by}</b> proposes <b>${f.proposal.kind}</b>: “${esc(f.proposal.reason)}”${f.proposal.until ? ` Reopens on ${f.proposal.until}.` : ""}</p>
      <div class="acts"><button class="btn primary" data-act="approve" data-id="${f.id}">Approve</button><button class="btn" data-act="reject" data-id="${f.id}">Reject</button></div></div>`;
        else if (f.unconfirmed)
          decide = `<div class="decision wait"><h4 style="color:var(--st-wait)">${ICON.moved.replace("<svg", '<svg width="15" height="15"')} Unconfirmed fix</h4>
      <p>The last Scan no longer sees this, but opened <span class="mono">${f.unconfirmed}</span> with the same Rule on this Repo. It may have moved.</p>
      <div class="acts"><button class="btn primary" data-act="confirmfix" data-id="${f.id}">Confirm fix</button><button class="btn" data-act="moved" data-id="${f.id}">Mark moved</button></div></div>`;
        else if (f.mod === "guard" && f.status === "open" && f.fix !== undefined) {
          if (f.fix === "none")
            decide = `<div class="decision"><h4>${ICON.pr.replace("<svg", '<svg width="15" height="15"')} Fix PR</h4><p>Warden can open a pull request that moves the key into an environment variable. A person merges it; the next Scan confirms the fix.</p>
      <div class="acts"><button class="btn primary" data-act="openpr" data-id="${f.id}" ${S.fixBusy ? 'aria-busy="true" disabled' : ""}>${S.fixBusy ? "Opening…" : "Open a Fix PR"}</button><button class="btn" data-act="accept" data-id="${f.id}">Accept…</button><button class="btn" data-act="fpmark" data-id="${f.id}">Mark False positive</button></div></div>`;
          else
            decide = `<div class="decision done"><h4 style="color:var(--st-fixed)">${ICON.pr.replace("<svg", '<svg width="15" height="15"')} Fix PR open</h4><p><a href="#" style="color:var(--accent)">acme/shop-web#14</a>: “Move the Stripe key out of config/payments.ts”. Waiting for a person to merge it; the next Scan marks the Finding Fixed.</p></div>`;
        } else if (f.status === "open")
          decide = `<div class="decision"><h4>Decide</h4><p class="muted">${f.patch ? `Upgrade ${esc(f.loc.split(" ")[0])} to ${esc(f.patch.fixedIn)}, or accept the risk with a reason and a date.` : "Accept the risk with a reason and an expiry, or mark it a False positive."}</p>
      <div class="acts"><button class="btn" data-act="accept" data-id="${f.id}">Accept…</button><button class="btn" data-act="fpmark" data-id="${f.id}">Mark False positive</button></div></div>`;
        const kv = [
          ["Asset", `${f.asset} ${esc(f.ref)}`],
          ["Location", `<span class="mono">${esc(f.loc)}</span>`],
          ["Evidence", esc(f.ev)],
        ];
        if (f.secret) kv.push(["Secret", `<span class="mono">${esc(f.secret)}</span>`]);
        if (f.control)
          kv.push([
            "Control",
            `<a href="#" data-page="overview" style="color:var(--accent)">${f.control}</a>`,
          ]);
        if (f.until) kv.push(["Reopens on", f.until]);
        const patch = f.patch
          ? `<div class="sectionh">Patch</div><dl class="kv"><dt>Your version</dt><dd><b>${f.patch.verdict}</b><br><span class="muted">${esc(f.patch.why)}</span></dd><dt>Fixed in</dt><dd class="mono">${esc(f.patch.fixedIn)}</dd></dl>`
          : "";
        const seed = [
          {
            who: "Warden",
            w: 1,
            at: "3d",
            kind: "risk",
            text:
              f.sev === "critical"
                ? `${SEVW[f.sev]}: ${f.ev}.`
                : `Found by the Scan on Nov 24: ${f.ev}.`,
          },
          ...(f.proposal
            ? [
                {
                  who: f.proposal.by,
                  at: f.proposal.at,
                  kind: "proposal",
                  text: `${f.proposal.kind}: ${f.proposal.reason}`,
                },
              ]
            : []),
        ];
        return {
          head: `<span><b>${f.mod === "vouch" ? "Control" : "Finding"}</b> <span class="where">in ${MODW[f.mod]}</span></span>`,
          id: f.id,
          card: `<div class="dcard"><div class="ids"><span class="mono">${f.id}</span>·${modt(f.mod)}<span class="mono">${f.rule}</span></div><h2>${esc(f.title)}</h2>
      <div class="statehead">${sevp(f.sev)}${st(s)}</div><dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>${patch}${decide}</div>`,
          thread: chatFor(f.id, seed),
          ctx: `Talking about: <span class="mono">${f.id}</span> · view: Findings, ${TABS.find((t) => t[0] === S.tab)[1]}`,
        };
      }
      function controlDetail(c) {
        const decide =
          c.review !== "Reviewed"
            ? `<div class="decision wait"><h4 style="color:var(--st-wait)">${ICON.wait.replace("<svg", '<svg width="15" height="15"')} Waiting for a Lead's review</h4>
      <p>Vouch worked out <b>${c.verdict}</b>. Confirm it, or override it with a reason.</p>
      ${
        S.overriding
          ? `<div class="form"><label>Verdict<select id="ovv"><option>Evidenced</option><option>Partly evidenced</option><option>Not evidenced</option><option>Not applicable</option></select></label><label>Reason<textarea id="ovr" rows="3" placeholder="Why the Verdict is different"></textarea></label><div class="acts"><button class="btn primary" data-act="saveoverride" data-id="${c.ref}">Save override</button><button class="btn" data-act="canceloverride">Cancel</button></div></div>`
          : `<div class="acts"><button class="btn primary" data-act="confirm" data-id="${c.ref}">Confirm</button><button class="btn" data-act="override" data-id="${c.ref}">Override…</button></div>`
      }</div>`
            : `<div class="decision done"><h4 style="color:var(--st-fixed)">${ICON.fixed.replace("<svg", '<svg width="15" height="15"')} Reviewed</h4><p>${esc(c.by)}${c.reason ? `: “${esc(c.reason)}”` : ""}. ${c.gap ? "It's a Gap: its Open Findings need fixing or accepting." : ""}</p></div>`;
        return {
          head: `<span><b>Control</b> <span class="where">in Vouch · VDA ISA 2027.1</span></span>`,
          id: c.ref,
          card: `<div class="dcard" style="background:var(--tint-vouch);border-color:var(--line)"><div class="ids"><span class="mono">${c.ref}</span>·<span class="tag vouch">Vouch</span></div><h2>${esc(c.q)}</h2>
      <div class="statehead"><span class="st ${vclass(c.verdict)}">${c.verdict}</span>${st(cstate(c))}</div>
      <div class="sectionh">Evidence</div><ul style="margin:0;padding-left:18px;font-size:14px">${c.ev.map((e) => `<li><span class="mono">${esc(e.split(":")[0])}</span>:${esc(e.split(":").slice(1).join(":"))}</li>`).join("")}</ul>${decide}</div>`,
          thread: chatFor(c.ref, [
            {
              who: "Warden",
              w: 1,
              at: "1d",
              kind: "decision",
              text: `Worked out ${c.verdict} from ${c.ev.length} Rule${c.ev.length > 1 ? "s" : ""}.`,
            },
          ]),
          ctx: `Talking about: <span class="mono">${c.ref}</span> · view: Overview`,
        };
      }
      function stepDetail(s) {
        return {
          head: `<span><b>Setup</b> <span class="where">${esc(s.title)}</span></span>`,

        };
        const head = (key, title, sum, cls) =>
          `<button class="ph" data-epin="${key}" aria-expanded="${S.ePin[key]}"><h2>${title}</h2><span class="sum">${sum}</span><span class="chev" aria-hidden="true">${S.ePin[key] ? "▲ Hide" : "▼ Show"}</span></button>`;
        if (S.esummary !== "split") {
          const mcard = (m) => {
            const l = byMod(m);
            const top = l[0];
            return `<button class="ag-${m}${chg("m" + m)}" data-agent="${m}" ${top ? `data-eref="${top.ref}"` : ""}><b>${eAvatar(m, "sm")}${AGENTS[m].name}${l.length ? `<span class="wbadge">${l.length} waiting</span>` : ""}</b><span class="muted cnt">${openOf(m)}</span><span class="top">${top ? `<span class="st wait">${ICON.wait}${esc(top.k)}</span> ${esc(top.t)}` : `<span class="muted">Nothing waits</span>`}</span></button>`;
          };
          return `<div class="e-pinned">
          <section class="e-pin sum">${head("sum", "Summary", `${open.length} open · ${crit} Critical · ${wl.length} waiting`)}
            ${S.ePin.sum ? `<div class="pb"><div class="e-tot${chg("mtot")}">${now.mtot}${setup.length ? ` <a href="#" data-agent="setup" data-eref="${setup[0].ref}" style="color:var(--accent)">Open Setup →</a>` : ""}</div><div class="e-sum e-wsum">${mcard("guard")}${mcard("patch")}${mcard("vouch")}</div></div>` : ""}</section>
        </div>`;
        }
        return `<div class="e-pinned">
          <section class="e-pin ov">${head("ov", "Findings", `${open.length} open · ${open.filter((f) => f.sev === "critical").length} Critical`)}
            ${S.ePin.ov ? `<div class="pb"><div class="e-tot${chg("tot")}">${now.tot}</div><div class="e-sum">${card("guard")}${card("patch")}${card("vouch")}</div></div>` : ""}</section>
          <section class="e-pin wait">${head("wait", "Waiting on a Lead", wl.length ? `${wl.length} ${wl.length === 1 ? "thing" : "things"}` : "Nothing waits")}
            ${S.ePin.wait ? `<div class="pb"><div class="e-tot${chg("wtot")}">${now.wtot}${setup.length ? ` <a href="#" data-agent="setup" data-eref="${setup[0].ref}" style="color:var(--accent)">Open Setup →</a>` : ""}</div><div class="e-sum e-wsum">${wcard("guard")}${wcard("patch")}${wcard("vouch")}</div></div>` : ""}</section>
        </div>`;
      }
      function eWardenFeed() {
        return `<div class="e-day">Today, Nov 27</div>
          ${msg("warden", "9:20 AM", `Morning. The Findings and what waits on a Lead are summed up above; they change as Guard, Patch and Vouch act.`)}
          ${msg("warden", "9:21 AM", `The most urgent fix: <b>${esc(F[0].title)}</b> (Critical, Guard). Guard can open a Fix PR for it, in its feed.`)}
          ${eLogMsgs("warden")}
          ${EASK.map(eAskMsgs).join("")}`;
      }
      // Mocked coordinator chat: the Lead asks Warden, Warden hands the question to Patch, and
      // Patch's answer shows in Warden's chat. Answers are worked out from the data at render time,
      // so they stay true after a Lead acts. No model is called.
      const EASK = [];
      const ASKS = {
        pwait: "What's Patch waiting on?",
        purgent: "Which of Patch's Findings should we fix first?",
      };
      const SEVO = { critical: 0, high: 1, medium: 2, low: 3 };
      function ePatchTop() {
        return F.filter((f) => f.mod === "patch" && f.status === "open").sort(
          (x, y) => SEVO[x.sev] - SEVO[y.sev],
        );
      }
      function eAskMsgs(k) {
        const mock = `<span class="mock-tag">MOCK</span>`;
        const relay = `<span class="relay">${eAvatar("warden", "sm")}via Warden</span>`;
        // One action row: the link to the item in Patch's feed, then Patch's own buttons for it.
        const acts = (f) =>
          `<div class="acts"><button class="btn" data-agent="patch" data-eref="${f.id}">Open in Patch's feed →</button>${eActsF(f).replace(/^<div class="acts">|<\/div>$/g, "")}</div>`;
        const card = (f) =>
          `<div class="e-item" style="border-left:4px solid var(--ag)"><div class="meta">${sevp(f.sev)}${st(fstate(f))}<span class="mono muted">${f.id}</span></div><div class="t">${esc(f.title)}</div><div class="meta"><span class="tag">${f.asset}: ${esc(f.ref)}</span><span class="tag mono">${esc(f.loc)}</span></div></div>`;
        let answer;
        const open = ePatchTop();
        if (k === "pwait") {
          const w = F.filter((f) => f.mod === "patch" && (f.proposal || f.unconfirmed));
          answer = w.length
            ? `${w.length} of my Findings wait on a Lead:${w.map((f) => card(f) + eActsF(f)).join("")}`
            : `Nothing of mine waits on a Lead: no Proposals and no Unconfirmed fixes. I have <b>${open.length} open Findings</b>, ${open.filter((f) => f.sev === "critical").length} Critical. None needs a decision from a Lead yet: an upgrade fixes each one.${open[0] ? acts(open[0]) : ""}`;
        } else {
          const f = open[0];
          answer = f
            ? `<b>${esc(f.id)}</b> first. ${esc(f.ref)} runs <span class="mono">${esc(f.loc)}</span>, so the version is <b>${f.patch.verdict}</b>: ${esc(f.patch.why)}. Fixed in <span class="mono">${esc(f.patch.fixedIn)}</span>.${card(f)}${acts(f)}`
            : "I have no open Findings. Nothing to fix.";
        }
        return `${pmsg("You (Lead)", "now", `${mock}${esc(ASKS[k])}`, "warden")}
          ${msg("warden", "now", `${mock}That's Patch's. I've asked it; its answer is below.`)}
          ${msg("patch", "now", `${relay}${mock}${answer}`, "relayed")}`;
      }
      function eQuick(a) {
        const items = {
          warden: [
            ["Open Setup", "setup"],
            ["Show the journey", "overview"],
            ["Products", "products"],
            ["People", "people"],
          ],
          guard: [
            ["Scan now", "mock"],
            ["Show Guard's Findings as a table", "findings"],
            ["Repos on Setup", "setup"],
            ["Show the hook token", "mock"],
          ],
          patch: [
            ["Add a Product", "products"],
            ["Show Patch's Findings as a table", "findings"],
            ["Refresh CVEs", "mock"],
          ],
          vouch: [
            ["Show every Control", "overview"],
            ["Catalogues on Setup", "setup"],
            ["Export evidence", "mock"],
          ],
        }[a];
        return items
          .map(
            ([w, to]) =>
              `<button class="qa" data-equick="${to}" data-ew="${esc(w)}"><span class="ic"></span>${w}</button>`,
          )
          .join("");
      }
      function renderE() {
        const a = S.agent;
        const feed = a === "warden" ? eWardenFeed() : a === "vouch" ? eVouchFeed() : eModuleFeed(a);
        const facts =
          a === "warden"
            ? `<div>Team: <b>Elm</b> · Admin</div><div>Level: Quick</div><div class="live">Last Scan Nov 27, 9:14 AM</div>`
            : a === "vouch"
              ? `<div>Catalogue: VDA ISA 2027.1</div><div>${C.filter((c) => c.gap).length} Gaps</div><div>${waitingC().length} to review</div>`
              : `<div>${F.filter((f) => f.mod === a && f.status === "open").length} open Findings</div><div>${F.filter((f) => f.mod === a && f.status === "fixed").length} Fixed</div><div class="live">Last Scan Nov 27</div>`;
        document.getElementById("root").innerHTML = `<div class="e-app">
          <aside class="e-agents"><div class="brand"><b>Warden</b></div><div class="team"><div class="who"><b>Elm</b><div class="muted" style="font-size:12.5px">Level: Quick</div></div><span class="pill role">Admin</span></div>
            <div class="e-list" role="list">${AG_ORDER.map((x) => `<button role="listitem" class="e-ag ag-${x} ${x === "warden" ? "top" : ""} ${a === x ? "sel" : ""}" data-agent="${x}" ${a === x ? 'aria-current="true"' : ""}>${eAvatar(x, x === "warden" ? "big" : "")}<span class="nm">${AGENTS[x].name}</span><span class="tm">${eWait(x) ? `<span class="wbadge">${eWait(x)} waiting</span>` : "9:14 AM"}</span><span class="last">${eLast(x)}</span></button>`).join("")}</div>
            <div class="foot" style="border-top:1px solid var(--line);padding:10px 16px 14px;font-size:13px;color:var(--muted)">Signed in as Elm's Admin · <a href="#" style="color:var(--accent)">Sign out</a></div></aside>
          <nav class="e-mobtabs" aria-label="Agents">${AG_ORDER.map((x) => `<button class="ag-${x} ${a === x ? "sel" : ""}" data-agent="${x}">${eAvatar(x, "sm")}${AGENTS[x].name}${eWait(x) ? `<span class="wbadge">${eWait(x)}</span>` : ""}</button>`).join("")}</nav>
          <main class="e-main ag-${a}"><header class="e-head">${eAvatar(a)}<div><h1>${AGENTS[a].name}</h1><div class="sub">${AGENTS[a].role}</div></div><span style="flex:1"></span>${eWait(a) ? `<span class="wbadge">${eWait(a)} waiting on a Lead</span>` : ""}</header>
            <div class="e-quickrow ag-${a}">${eQuick(a)}</div>
            ${a === "warden" ? eWardenPinned() : ""}
            <div class="e-feed" id="efeed">${feed}</div>
            <div class="e-composer">${
              a === "warden"
                ? `<div class="e-asks" aria-label="Ask Warden (mock)">${Object.entries(ASKS)
                    .map(([k, q]) => `<button class="qchip" data-eask="${k}">${esc(q)}</button>`)
                    .join("")}</div>`
                : ""
            }<div class="ctx"><span class="mock">MOCK</span><span class="why">Not connected: there is no chat with a model in this prototype.</span></div><div class="box"><input aria-label="Message ${AGENTS[a].name} (mock)" placeholder="Message ${AGENTS[a].name}… (mock)"><button class="btn primary" data-emock>Send</button></div></div></main>
          <aside class="e-quick ag-${a}" aria-label="Quick actions"><h2>Quick actions</h2>${eQuick(a)}<h2>${AGENTS[a].name}</h2><div class="facts">${facts}</div></aside>
          <nav class="e-strip" aria-label="Agents">${AG_ORDER.map((x) => `<button class="ag-${x} ${a === x ? "sel" : ""}" data-agent="${x}" aria-label="${AGENTS[x].name}">${eAvatar(x, "sm")}${eWait(x) ? `<span class="dotw">${eWait(x)}</span>` : ""}</button>`).join("")}</nav>
        </div>
        <div class="switcher" role="toolbar" aria-label="Prototype variants"><button data-sw="-1" aria-label="Previous variant">←</button><span class="lbl">${S.variant} (${VARIANTS[S.variant]})</span><button data-sw="1" aria-label="Next variant">→</button><button class="theme" data-theme-t>${S.theme || "auto"} theme</button></div>`;
        if (S.eref) {
          const el = document.querySelector(`[data-esel="${S.eref}"]`);
          if (el) el.scrollIntoView({ block: "center" });
          S.eref = null;
        } else if (eScrollEnd) {
          // A question just asked: bring it to the top of the feed, so its answer reads from the start.
          const fd = document.getElementById("efeed");
          const qs = fd.querySelectorAll(".e-msg.person");
          const q = qs[qs.length - 1];
          fd.scrollTop = q ? q.offsetTop - fd.offsetTop - 8 : fd.scrollHeight;
        } else if (S.agent !== eLastAgent) {
          // A feed opens at its newest message, as a chat does: what waits on a Lead is at the bottom.
          const fd = document.getElementById("efeed");
          fd.scrollTop = fd.scrollHeight;
        }
        eLastAgent = S.agent;
        eScrollEnd = false;
      }
      let eScrollEnd = false;
      let eLastAgent = null;
      document.addEventListener("click", (e) => {
        if (S.variant !== "E") return;
        const t = e.target.closest(
          "[data-eask],[data-epin],[data-agent],[data-esel],[data-equick],[data-eoverride],[data-emock]",
        );
        if (!t) return;
        if (t.dataset.eask) {
          EASK.push(t.dataset.eask);
          eScrollEnd = true;
          return render();
        }
        if (t.dataset.epin) {
          S.ePin[t.dataset.epin] = !S.ePin[t.dataset.epin];
          return render();
        }
        if (t.dataset.agent) {
          if (t.dataset.agent === "setup") {
            S.variant = "D";
            S.page = "setup";
            S.sel = t.dataset.eref;
            return render();
          }
          S.agent = t.dataset.agent;
          S.esel = t.dataset.eref || null;
          S.eref = t.dataset.eref || null;
          S.overriding = false;
          return render();
        }
        if (t.dataset.eoverride) {
          S.esel = t.dataset.eoverride;
          S.overriding = true;
          return render();
        }
        if (t.dataset.esel) {
          S.esel = S.esel === t.dataset.esel ? null : t.dataset.esel;
          return render();
        }
        if (t.dataset.emock !== undefined) {
          const i = t.parentElement.querySelector("input");
          i.value = "";
          i.placeholder = "Mock: Warden's chat isn't connected.";
          return;
        }
        if (t.dataset.equick) {
          const to = t.dataset.equick;
          if (to === "mock") {
            ELOG[S.agent === "warden" ? "warden" : S.agent].push({
              who: "Warden",
              kind: "",
              text: `${t.dataset.ew}: mock, the real app starts it here.`,
              ref: "",
              agent: true,
            });
            return render();
          }
          S.variant = "D";
          S.page = to;
          if (to === "findings" && S.agent !== "warden") {
            S.mod = S.agent;
            S.tab = "all";
          }
          S.sel = null;
          return render();
        }
      });
      render();
    </script>
  </body>
</html>
